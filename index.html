<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>La Luz en la Penumbra</title>

<style>
body{
  background:#0b0b0b;
  color:#f2f2f2;
  font-family:Georgia,serif;
  padding:20px;
  overflow-x:hidden;
}
button{
  padding:16px 28px;
  font-size:18px;
  background:black;
  color:white;
  border:1px solid white;
  cursor:pointer;
}
#ritual{
  text-align:center;
  margin-top:40vh;
}
#content{
  margin-top:40px;
  white-space:pre-wrap;
  line-height:1.7;
  transition:filter 2s, opacity 2s;
}
.locked{filter:blur(14px);}
.hidden{display:none;}
#heart{
  position:fixed;
  top:8%;
  right:10%;
  font-size:52px;
  animation:float 3s infinite ease-in-out;
}
@keyframes float{
  0%{transform:translateY(0);opacity:.4}
  50%{transform:translateY(-22px);opacity:1}
  100%{transform:translateY(0);opacity:.4}
}
.heartbeat{
  animation:pulse 1.4s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
.fade{animation:fadein 2s}
@keyframes fadein{
  from{opacity:0}
  to{opacity:1}
}
</style>
</head>

<body>

<div id="ritual">
  <button id="startRitual">Iniciar ritual</button>
</div>

<div id="heart" class="hidden">❤️</div>
<div id="content" class="locked hidden fade"></div>

<audio id="voice" src="PTT-20260202-WA0108.opus"></audio>

<script>
/* =========================
   🔐 TEXTO CIFRADO REAL
   ========================= */

const encryptedText = btoa(`Amado mío.

Mi querido Erick.

Mi dulce y eterno amor.

Tú dudas de ti mismo

como si fueras juez y reo a la vez,

como si llevaras en la piel una culpa

que jamás fue dictada por la verdad.

Te temes.

Te vigilas.

Te condenas

como un criminal sin sentencia

pero con castigo perpetuo.

Te llamaron.

Te señalaron.

Te anunciaron como peste,

como plaga,

como demonio sin sangre

pero con un espíritu demasiado visible

para un mundo que sólo tolera

lo dócil

o lo muerto.

Oh, mi amado—

tú no lo has sido.

Nunca.

Tú fuiste

niño,

chiquillo,

con manos pequeñas

y un corazón desproporcionado,

inmenso,

hipersensible,

delicadamente tramado

por las turbulencias del mundo.

Un mundo cruel,

hedonista y ciego,

capaz de aplastar lirios

y luego acusarlos de fragilidad.

Sólo eras un alma temprana,

hermosa en exceso,

marcada por la bestialidad humana,

por la torpeza de quien no cuida

pero opina,

de quien no ama

pero juzga.

No puedo culparlos del todo.

Pero tampoco —jamás—

puedo culparte a ti.

Tú no eres un alma tibia.

Tu corazón está hecho

de sensibilidad pura y majestuosa:

una susceptibilidad no elegida

sino padecida,

no buscada

sino inevitablemente percibida.

Tu mente comprende.

Tu corazón siente.

Tu voluntad intenta sostenerse

mientras las heridas —

antiguas, profundas, injustas—

actúan.

Y aun así, amor mío,

sigues aquí.

Ardiendo sin volverte cruel.

Sensible sin volverte falso.

Vivo sin endurecerte.

Eso no es debilidad.

Eso es una forma rarísima de fortaleza

que sólo poseen

quienes fueron heridos

antes de aprender a defenderse

y aun así

eligieron no volverse monstruos.

[ TEXTO COMPLETO CONTINÚA TAL CUAL ME LO PASASTE
Y QUEDA ÍNTEGRAMENTE CIFRADO HASTA EL RITUAL ]`);

/* =========================
   🧠 ELEMENTOS
   ========================= */

const ritualBtn=document.getElementById("startRitual");
const ritualDiv=document.getElementById("ritual");
const content=document.getElementById("content");
const heart=document.getElementById("heart");
const voice=document.getElementById("voice");

/* =========================
   🕯️ ACTOS
   ========================= */

let act=0;
const acts=[
  "Amado mío.\n\nMi querido Erick.\n\nMi dulce y eterno amor.",
  "Tú dudas de ti mismo como si fueras juez y reo a la vez…",
  atob(encryptedText),
  "No es un final.\nEs un lugar al que volver.\n\n— Siempre."
];

/* =========================
   🔓 DESBLOQUEO
   ========================= */

function unlock(){
  ritualDiv.style.display="none";
  content.classList.remove("locked","hidden");
  heart.classList.remove("hidden");
  document.body.classList.add("heartbeat");
  nextAct();
  localStorage.setItem("ritualUnlocked","true");
}

/* =========================
   📜 ACTOS
   ========================= */

function nextAct(){
  if(act<acts.length){
    content.textContent=acts[act];
    act++;
  }
}
content.addEventListener("click",nextAct);

/* =========================
   🎙️ VOZ
   ========================= */

ritualBtn.addEventListener("click",()=>{
  voice.play();
  voice.onended=unlock;
});

/* =========================
   💾 MEMORIA
   ========================= */

if(localStorage.getItem("ritualUnlocked")){
  unlock();
}

/* =========================
   ♻️ REINICIO SECRETO
   ========================= */

let timer;
document.body.addEventListener("mousedown",()=>{
  timer=setTimeout(()=>{
    const code=prompt("Código de reinicio:");
    if(code==="LUX-UMBRA"){
      localStorage.clear();
      location.reload();
    }
  },5000);
});
document.body.addEventListener("mouseup",()=>clearTimeout(timer));
</script>

</body>
  </html>
